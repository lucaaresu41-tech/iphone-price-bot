name: Monitor prezzo iPhone

on:
  schedule:
    - cron: "7 * * * *"   # ogni ora (al minuto 7). GitHub può ritardare di qualche minuto.
  workflow_dispatch:       # permette di avviarlo a mano dalla scheda "Actions"
    inputs:
      force_summary:
        description: "Invia subito il riepilogo con grafico"
        type: boolean
        default: false

permissions:
  contents: write          # serve per salvare lo storico prezzi nel repository

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controllo prezzi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_PRICE: ${{ vars.TARGET_PRICE }}
          FORCE_SUMMARY: ${{ inputs.force_summary && '1' || '0' }}
        run: python bot.py

      - name: Salva storico
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "Aggiornamento prezzi" && git push)
